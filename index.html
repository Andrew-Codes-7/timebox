      case 'theme': setTheme(actEl.dataset.v); openSettings(true); return;
      case 'history': $('#pop').classList.remove('show'); openHistory(); return;
      case 'history-close': $('#history').classList.remove('show'); return;
      case 'hist-more': ui.histLimit += 300; renderHistory(); return;
      case 'done-collapse': ui.doneCollapsed = !ui.doneCollapsed; savePref('timebox.doneCollapsed', ui.doneCollapsed ? '1' : '0'); render(); return;
      case 'filter-open': {
        const menu = $('#filter-menu');
        if(menu.classList.contains('show')){ menu.classList.remove('show'); return; }
        const count = f => st.tasks.filter(x => !x.done && (f === '' || (f === 'none' ? !(x.cat && catById(x.cat)) : x.cat === f))).length;
        const item = (v, label, color) => `<button class="menu-item${ui.filter === v ? ' on' : ''}" data-act="filter" data-v="${v}" role="menuitemradio" aria-checked="${ui.filter === v}">
          ${color ? `<span class="dot" style="--c:${color}"></span>` : '<span class="dot all"></span>'}<span class="nm">${esc(label)}</span><span class="n">${count(v) || ''}</span></button>`;
        menu.innerHTML = item('', 'All categories') + '<hr>' +
          st.settings.categories.map(c => item(c.id, c.name, c.color)).join('') +
          item('none', 'No category', '#C7C7CC');
        const r = actEl.getBoundingClientRect();
        menu.style.top = (r.bottom + 6) + 'px';
        menu.style.right = Math.max(12, innerWidth - r.right) + 'px';
        menu.classList.add('show');
        return;
      }
      case 'filter':
        setFilter(actEl.dataset.v); $('#filter-menu').classList.remove('show'); render();
        return;
      case 'export': exportData(); return;
      case 'import': $('#import-file').click(); return;
      case 'clear-all-done': {
        const gone = st.tasks.filter(x => x.done); pop.classList.remove('show');
        archiveTasks(gone).then(ok => { render(); if(ok) toast(`Moved ${gone.length} to History`, 'View', openHistory); });
        return;
      }
    }
    // Click on an empty part of a future time block → prefill quick add with that time.
    const body = e.target.closest('.slot-body');
    if(body && !e.target.closest('.card')){
      const slotEl = body.closest('.slot');
      if(slotEl.classList.contains('past')) return;
      ui.quickSlot = +slotEl.dataset.slot;
      renderQuickChips(); quick.focus();
    }
  });

  $('#hist-search').addEventListener('input', () => { ui.histLimit = 200; renderHistory(); });
  document.addEventListener('input', e => {
    const el = e.target, act = el.dataset && el.dataset.act;
    const t = act ? taskFrom(el) : null;
    if(act === 'title' && t){ if(el.value.trim()) { t.title = el.value.trim(); saveSoon(); } }
    else if(act === 'notes' && t){ t.notes = el.value; grow(el); saveSoon(); }
    else if(act === 'sub-edit' && t){ const s = subFrom(el, t); if(s){ s.t = el.value; saveSoon(); } }
    else if(act === 'list-name'){ const l = st.settings.lists.find(l => l.id === el.dataset.lid); if(l && el.value.trim()){ l.name = el.value.trim(); saveSettingsSoon(); } }
    else if(act === 'cat-name'){ const c = catById(el.dataset.cid); if(c && el.value.trim()){ c.name = el.value.trim(); saveSettingsSoon(); } }
  });

  document.addEventListener('change', e => {
    const el = e.target, act = el.dataset && el.dataset.act;
    const t = act ? taskFrom(el) : null;
    if(act === 'time' && t) setTime(t, el.value === '' || el.value === 'now' ? el.value : +el.value);
    else if(act === 'date' && t && el.value){
      const n = dayDiff(todayISO(), el.value);
      ui.open.delete(t.id);
      if(n <= 0){ const o = appendOrder('anytime'); place(t, 'anytime'); t.order = o; }
      else { t.list = '@day'; t.date = el.value; t.slot = null; t.month = null; t.pushedFrom = null; t.order = 1e5 + Date.now() % 1e5; }
      save(); showMoved(t); toast(`Moved to ${zoneLabel(t.list === 'today' ? 'anytime' : 'list:' + bucketOf(t))}`);
    }
    else if(act === 'dur-custom' && t){ const v = Math.round(+el.value); t.dur = v >= 1 && v <= 720 ? v : null; save(); render(); }
    else if(act === 'day-start' || act === 'day-end'){
      st.settings[act === 'day-start' ? 'dayStart' : 'dayEnd'] = +el.value;
      if(st.settings.dayEnd <= st.settings.dayStart) st.settings.dayEnd = Math.min(24, st.settings.dayStart + 1);
      saveSettings(); render(); openSettings(true);
    }
  });

  document.addEventListener('focusout', e => {
    const el = e.target;
    if(el.dataset && el.dataset.act === 'list-name'){
      const l = st.settings.lists.find(l => l.id === el.dataset.lid);
      if(l && !el.value.trim()) el.value = l.name;
      saveSettings(); render();
    }
    if(el.dataset && el.dataset.act === 'cat-name'){
      const c = catById(el.dataset.cid);
      if(c && !el.value.trim()) el.value = c.name;
      saveSettings(); render();
    }
    if(el.dataset && el.dataset.act === 'title'){
      const t = taskFrom(el);
      if(t && !el.value.trim()) el.value = t.title; // never leave a task nameless
    }
  });

  document.addEventListener('keydown', e => {
    const el = e.target, act = el.dataset && el.dataset.act;
    if(e.key === 'Enter' && !e.isComposing){
      if(act === 'sub-add'){
        e.preventDefault();
        const t = taskFrom(el), v = el.value.trim();
        if(t && v){ t.subs.push({ id:uid(), t:v, done:false }); save(); render(); }
        return;
      }
      if(act === 'sub-edit'){ // Enter on a subtask jumps to the "add" line, like Reminders
        e.preventDefault(); const t = taskFrom(el);
        const add = t && document.querySelector(`[data-fk="subadd:${t.id}"]`); if(add) add.focus();
        return;
      }
      if(act === 'title' || act === 'cat-name' || act === 'list-name'){ e.preventDefault(); el.blur(); return; }
      if(act === 'newlist-add'){
        e.preventDefault();
        const name = el.value.trim(); if(!name) return;
        st.settings.lists.push({ id:uid(), name });
        saveSettings(); render(); openSettings(true);
        return;
      }
      if(act === 'cat-add'){
        e.preventDefault();
        const name = el.value.trim(); if(!name) return;
        const used = st.settings.categories.map(c => c.color);
        const color = CAT_COLORS.find(h => !used.includes(h)) || CAT_COLORS[st.settings.categories.length % CAT_COLORS.length];
        st.settings.categories.push({ id:uid(), name, color });
        saveSettings(); render(); openSettings(true);
        return;
      }
      if(act === 'list-add'){
        e.preventDefault();
        if(addTask(el.value, el.dataset.list, null)){ const f = document.querySelector(`[data-fk="${el.dataset.fk}"]`); if(f) f.value = ''; }
        return;
      }
    }
    if(e.key === 'Backspace' && act === 'sub-edit' && el.value === ''){
      e.preventDefault();
      const t = taskFrom(el), s = subFrom(el, t);
      if(t && s){
        const i = t.subs.indexOf(s); t.subs.splice(i, 1); save(); render();
        const prev = t.subs[i - 1];
        const f = document.querySelector(prev ? `[data-fk="sub:${prev.id}"]` : `[data-fk="subadd:${t.id}"]`);
        if(f){ f.focus(); try{ f.setSelectionRange(f.value.length, f.value.length); }catch(err){} }
      }
      return;
    }
    if(e.key === 'Escape'){
      if($('#history').classList.contains('show')){ $('#history').classList.remove('show'); return; }
      if($('#filter-menu').classList.contains('show')){ $('#filter-menu').classList.remove('show'); return; }
      if($('#pop').classList.contains('show')){ $('#pop').classList.remove('show'); return; }
      if(el !== document.body && el.blur) el.blur();
      if(ui.open.size){ ui.open.clear(); render(); }
      return;
    }
    const typing = /INPUT|TEXTAREA|SELECT/.test(el.tagName);
    if(!typing && (e.key === 'n' || e.key === '/') && !e.metaKey && !e.ctrlKey){ e.preventDefault(); quick.focus(); }
  });

  document.addEventListener('contextmenu', e => { if(e.target.closest('.card-head') && drag.pending) e.preventDefault(); });

  /* ================= Drag & drop =================
     Pointer-based so it works the same with mouse, trackpad and touch.
     Mouse: press and move. Touch: press and hold briefly, then move. */
  const drag = { pending:null, active:false, id:null, src:null, ghost:null, badge:null, x:0, y:0, offX:0, offY:0,
                 zoneEl:null, zoneKey:null, index:0, raf:0, timer:0, pid:null, tabTimer:0, tabHover:null };
  const line = $('#drop-line');

  document.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const card = e.target.closest('.card[data-id]');
    if(!card || card.classList.contains('mini') || e.target.closest('input,textarea,button,select,a,[data-nodrag]')) return;
    drag.pending = { card, id:card.dataset.id, sx:e.clientX, sy:e.clientY, pid:e.pointerId, type:e.pointerType };
    drag.x = e.clientX; drag.y = e.clientY;
    if(e.pointerType !== 'mouse'){
      card.classList.add('pressing');
      drag.timer = setTimeout(() => { if(drag.pending) startDrag(); }, 260);
    }
  });
  document.addEventListener('pointermove', e => {
    if(drag.active){
      if(e.pointerId !== drag.pid) return;
      drag.x = e.clientX; drag.y = e.clientY;
      e.preventDefault();
      return;
    }
    const p = drag.pending;
    if(!p || e.pointerId !== p.pid) return;
    drag.x = e.clientX; drag.y = e.clientY;
    const dist = Math.hypot(e.clientX - p.sx, e.clientY - p.sy);
    if(p.type === 'mouse'){ if(dist > 5) startDrag(); }
    else if(dist > 9) cancelPending(); // moved before the hold finished → it's a scroll
  }, { passive:false });
  document.addEventListener('pointerup', e => { if(drag.active){ if(e.pointerId === drag.pid) endDrag(true); } else cancelPending(); });
  document.addEventListener('pointercancel', e => { if(drag.active){ if(e.pointerId === drag.pid) endDrag(false); } else cancelPending(); });
  // Once a touch drag has started, stop the page from scrolling underneath it.
  document.addEventListener('touchmove', e => { if(drag.active) e.preventDefault(); }, { passive:false });
  window.addEventListener('blur', () => { if(drag.active) endDrag(false); });

  function cancelPending(){
    clearTimeout(drag.timer);
    if(drag.pending){ drag.pending.card.classList.remove('pressing'); drag.pending = null; }
  }

  function startDrag(){
    const p = drag.pending; if(!p) return;
    drag.pending = null; clearTimeout(drag.timer);
    const card = p.card; card.classList.remove('pressing');
    if(!card.isConnected) return;
    const r = card.getBoundingClientRect();
    Object.assign(drag, { active:true, id:p.id, pid:p.pid, src:card, offX:p.sx - r.left, offY:Math.min(p.sy - r.top, 40), zoneEl:null, zoneKey:null, index:0 });
    const g = card.cloneNode(true);
    g.classList.remove('open', 'flash', 'lifted');
    g.classList.add('ghost');
    const det = g.querySelector('.card-detail'); if(det) det.remove();
    g.style.width = r.width + 'px';
    const badge = document.createElement('span'); badge.className = 'ghost-badge'; g.appendChild(badge);
    document.body.appendChild(g);
    drag.ghost = g; drag.badge = badge;
    card.classList.add('lifted');
    document.body.classList.add('is-dragging');
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if(p.type !== 'mouse' && navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
    frame();
  }

  function frame(){
    if(!drag.active) return;
    apply();
    autoScroll();
    drag.raf = requestAnimationFrame(frame);
  }

  function apply(){
    drag.ghost.style.transform = `translate3d(${drag.x - drag.offX}px, ${drag.y - drag.offY}px, 0) rotate(1.2deg) scale(1.02)`;
    const hit = document.elementFromPoint(drag.x, drag.y);
    let zoneEl = hit ? hit.closest('[data-zone]') : null;
    if(zoneEl && zoneEl.closest('.ghost')) zoneEl = null;
    if(zoneEl !== drag.zoneEl){
      if(drag.zoneEl) drag.zoneEl.classList.remove('drop-on');
      drag.zoneEl = zoneEl; drag.zoneKey = zoneEl ? zoneEl.dataset.zone : null;
      if(zoneEl) zoneEl.classList.add('drop-on');
      drag.badge.textContent = zoneLabel(drag.zoneKey);
      springTab(zoneEl);
    }
    placeLine();
  }

  // Hovering a tab while dragging on a phone flips to that tab, so you can drop at an exact spot.
  function applyTab(tab){
    ui.tab = tab; document.body.dataset.tab = tab;
    $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $$('.list').forEach(l => l.classList.toggle('active', l.dataset.group === tab));
  }
  function springTab(zoneEl){
    clearTimeout(drag.tabTimer);
    if(zoneEl && zoneEl.classList.contains('tab') && zoneEl.dataset.tab !== ui.tab){
      const tab = zoneEl.dataset.tab;
      drag.tabTimer = setTimeout(() => { if(drag.active) applyTab(tab); }, 550);
    }
  }

  function placeLine(){
    const z = drag.zoneEl;
    const holder = z && z.querySelector('[data-cards]');
    if(!holder){ line.style.display = 'none'; drag.index = 0; return; }
    const cards = [...holder.children].filter(c => c.classList.contains('card') && c !== drag.src);
    if(!cards.length){ line.style.display = 'none'; drag.index = 0; return; }
    let idx = cards.length, y, r = null;
    for(let i = 0; i < cards.length; i++){
      r = cards[i].getBoundingClientRect();
      if(drag.y < r.top + r.height / 2 + 0.5){ idx = i; y = r.top - 4; break; }
    }
    if(idx === cards.length){ r = cards[cards.length - 1].getBoundingClientRect(); y = r.bottom + 2; }
    drag.index = idx;
    Object.assign(line.style, { display:'block', left:(r.left + 6) + 'px', width:(r.width - 12) + 'px', top:(y - 1) + 'px' });
  }

  function autoScroll(){
    const hit = document.elementFromPoint(drag.x, drag.y);
    const sc = (hit && hit.closest('.scroller')) || null;
    if(!sc) return;
    const r = sc.getBoundingClientRect(), edge = 64;
    let dy = 0;
    if(drag.y < r.top + edge) dy = -Math.ceil((r.top + edge - drag.y) / edge * 16);
    else if(drag.y > r.bottom - edge) dy = Math.ceil((drag.y - (r.bottom - edge)) / edge * 16);
    if(dy) sc.scrollTop += dy;
  }

  function endDrag(commit){
    cancelAnimationFrame(drag.raf);
    clearTimeout(drag.tabTimer);
    if(commit) apply(); // a fast flick can finish before its last frame ran
    const { id, zoneKey, index } = drag;
    if(drag.zoneEl) drag.zoneEl.classList.remove('drop-on');
    if(drag.ghost) drag.ghost.remove();
    if(drag.src) drag.src.classList.remove('lifted');
    line.style.display = 'none';
    document.body.classList.remove('is-dragging');
    Object.assign(drag, { active:false, ghost:null, src:null, zoneEl:null, zoneKey:null, pid:null });
    suppressClick = true; setTimeout(() => suppressClick = false, 60);
    if(commit && zoneKey === 'trash'){ const t = find(id); if(t){ sfx.undo(); deleteTask(t); } }
    else if(commit && zoneKey) moveTask(id, zoneKey, index);
    else if(remotePending) render();
    remotePending = false;
  }

  /* ================= Light / dark ================= */
  function themePref(){ return loadPref('timebox.theme') || 'light'; }
  function applyTheme(){
    const p = themePref();
    const mode = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
    document.documentElement.dataset.mode = mode;
    const b = $('#theme-btn');
    if(b) b.innerHTML = `<svg class="ic"><use href="#${mode === 'dark' ? 'i-sun' : 'i-moon'}"/></svg>`;
  }
  function setTheme(p){ savePref('timebox.theme', p); applyTheme(); }
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(themePref() === 'system') applyTheme(); }); }catch(e){}
  applyTheme();

  /* ================= Sound =================
     Short synthesized tones — no audio files. Checking several tasks in a
     row climbs in pitch; finishing everything today plays a little fanfare. */
  let AC = null;
  function soundOn(){ try{ return localStorage.getItem('timebox.sound') !== 'off'; }catch(e){ return true; } }
  function ac(){
    if(!soundOn()) return null;
    try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(e){ return null; }
    return AC;
  }
  function tone(f, at, dur, type = 'sine', vol = .12){
    const a = ac(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + at;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
  }
  const sfx = {
    check(combo){ const b = 523.25 * Math.pow(2, Math.min(combo, 12) / 12); tone(b, 0, .12, 'triangle'); tone(b * 1.5, .07, .2, 'triangle'); tone(b * 2, .07, .25, 'sine', .04); },
    pop(){ tone(880, 0, .07, 'sine', .08); },
    undo(){ tone(330, 0, .1, 'sine', .06); tone(262, .06, .12, 'sine', .06); },
    fanfare(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .3, 'triangle', .1)); tone(1047, .45, .6, 'triangle', .08); tone(1319, .45, .6, 'sine', .06); },
  };
  const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
  let comboN = 0, comboT = 0;
  function bumpCombo(){ const now = Date.now(); comboN = now - comboT < 8000 ? comboN + 1 : 0; comboT = now; return comboN; }

  /* ================= Reordering rows =================
     Subtasks, lists and categories each have a grip; drag it up or down. */
  document.addEventListener('pointerdown', e => {
    const grip = e.target.closest('.grip');
    if(!grip || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const row = grip.closest('[data-row]'), box = row && row.closest('[data-rows]');
    if(!box) return;
    e.preventDefault(); e.stopPropagation();
    const rows = [...box.children].filter(r => r.hasAttribute('data-row'));
    const from = rows.indexOf(row);
    const rects = rows.map(r => r.getBoundingClientRect());
    const step = rows.length > 1 ? rects[1].top - rects[0].top : rects[0].height;
    const startY = e.clientY;
    let to = from;
    row.classList.add('row-lift');
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    const move = ev => {
      const dy = Math.max(rects[0].top - rects[from].top, Math.min(rects[rects.length - 1].top - rects[from].top, ev.clientY - startY));
      row.style.transform = `translateY(${dy}px)`;
      const mid = rects[from].top + rects[from].height / 2 + dy;
      to = from;
      for(let i = from + 1; i < rows.length; i++) if(mid > rects[i].top + rects[i].height / 2 - 0.5) to = i;
      for(let i = from - 1; i >= 0; i--) if(mid < rects[i].top + rects[i].height / 2 + 0.5) to = i;
      rows.forEach((r, i) => {
        if(r === row) return;
        const shift = (from < to && i > from && i <= to) ? -step : (from > to && i < from && i >= to) ? step : 0;
        r.style.transform = shift ? `translateY(${shift}px)` : '';
      });
    };
    const end = () => {
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', end);
      grip.removeEventListener('pointercancel', end);
      rows.forEach(r => { r.style.transform = ''; });
      row.classList.remove('row-lift');
      if(to !== from) reorderRows(box.dataset.rows, row, from, to);
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  }, true);

  function reorderRows(kind, row, from, to){
    const shift = arr => { const [x] = arr.splice(from, 1); arr.splice(to, 0, x); };
    if(kind === 'subs'){
      const t = taskFrom(row); if(!t) return;
      shift(t.subs); save(); render();
    } else if(kind === 'lists'){
      shift(st.settings.lists); saveSettings(); render(); openSettings(true);
    } else if(kind === 'cats'){
      shift(st.settings.categories); saveSettings(); render(); openSettings(true);
    }
  }

  /* ================= Little extras ================= */
  function burst(el, color){
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const palette = [color, color, '#FFCC00', '#34C759', '#007AFF', '#AF52DE'];
    for(let i = 0; i < 12; i++){
      const d = document.createElement('span');
      d.className = 'confetti';
      d.style.background = palette[i % palette.length];
      d.style.left = cx - 3 + 'px'; d.style.top = cy - 3 + 'px';
      document.body.appendChild(d);
      const a = (i / 12) * Math.PI * 2 + Math.random() * .4, dist = 22 + Math.random() * 18;
      d.animate([
        { transform:'translate(0,0) scale(1)', opacity:1 },
        { transform:`translate(${Math.cos(a) * dist}px, ${Math.sin(a) * dist}px) scale(.3)`, opacity:0 }
      ], { duration:520 + Math.random() * 200, easing:'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => d.remove();
    }
  }

  let toastTimer = 0;
  function toast(msg, btnLabel, onBtn){
    const el = $('#toast'), btn = $('#toast-btn');
    $('#toast-msg').textContent = msg;
    btn.textContent = btnLabel || '';
    btn.onclick = onBtn ? () => { onBtn(); el.classList.remove('show'); } : null;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), onBtn ? 5000 : 2800);
  }

  function openSettings(keepOpen){
    const pop = $('#pop');
    if(pop.classList.contains('show') && !keepOpen){ pop.classList.remove('show'); return; }
    const a = document.activeElement, fk = a && pop.contains(a) && a.dataset ? a.dataset.fk : null;
    const hourOpts = (from, to, sel) => { let s = ''; for(let h = from; h <= to; h++) s += `<option value="${h}"${h === sel ? ' selected' : ''}>${h === 24 ? '12 AM' : fmtHour(h * 60)}</option>`; return s; };
    pop.innerHTML = `
      <h3>Settings</h3>
      <div class="row"><span>Day ends</span><select data-act="day-end">${hourOpts(13, 24, st.settings.dayEnd)}</select></div>
      <hr>
      <div class="row"><span>Appearance</span><div class="seg small">${['light', 'dark', 'system'].map(m => `<button class="${themePref() === m ? 'on' : ''}" data-act="theme" data-v="${m}">${m === 'system' ? 'Auto' : m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</div></div>
      <div class="row"><span>Completion sounds</span><button class="toggle${soundOn() ? ' on' : ''}" data-act="sound" role="switch" aria-checked="${soundOn()}" aria-label="Completion sounds"></button></div>
      <hr>
      <h3>Lists</h3>
      <div class="cat-row"><span class="grip" style="visibility:hidden"></span><span class="fixed">Today, Tomorrow, the next 5 days, This month, Next month <small>· automatic — tasks move forward on their own</small></span></div>
      <div data-rows="lists">
      ${st.settings.lists.map(l => `
        <div class="cat-row" data-row data-lid="${l.id}">
          <span class="grip" aria-label="Drag to reorder">${icon('i-grip')}</span>
          <input id="list-${l.id}" data-act="list-name" data-lid="${l.id}" data-fk="list:${l.id}" value="${esc(l.name)}" aria-label="List name">
          <button class="icon-btn sub-del" data-act="list-del" data-lid="${l.id}" aria-label="Delete ${esc(l.name)}">${icon('i-x')}</button>
        </div>`).join('')}
      </div>
      <div class="cat-row cat-add"><span class="grip" style="visibility:hidden"></span><input id="list-add" data-act="newlist-add" data-fk="newlist-add" placeholder="New list" enterkeyhint="done"></div>
      <hr>
      <h3>Categories</h3>
      <div data-rows="cats">
      ${st.settings.categories.map(c => `
        <div class="cat-row" data-row data-cid="${c.id}">
          <span class="grip" aria-label="Drag to reorder">${icon('i-grip')}</span>
          <button class="sw${c.pattern ? ' pat-' + c.pattern : ''}" style="--c:${c.color}" data-act="cat-color-open" data-cid="${c.id}" aria-label="Change colour of ${esc(c.name)}" title="Change colour"></button>
          <input id="cat-${c.id}" data-act="cat-name" data-cid="${c.id}" data-fk="cat:${c.id}" value="${esc(c.name)}" aria-label="Category name">
          <button class="icon-btn sub-del" data-act="cat-del" data-cid="${c.id}" aria-label="Delete ${esc(c.name)}">${icon('i-x')}</button>
          ${ui.catEdit === c.id ? `<div class="cat-palette">
            <span class="lbl">Colour</span>
            ${CAT_COLORS.map(h => `<button class="sw${h === c.color ? ' on' : ''}" style="--c:${h}" data-act="cat-color" data-cid="${c.id}" data-v="${h}" aria-label="Colour ${h}"></button>`).join('')}
            <span class="lbl">Pattern</span>
            ${PATTERNS.map(pt => `<button class="sw${pt.k ? ' pat-' + pt.k : ''}${(c.pattern || '') === pt.k ? ' on' : ''}" style="--c:${c.color}" data-act="cat-pattern" data-cid="${c.id}" data-v="${pt.k}" title="${pt.label}" aria-label="${pt.label}"></button>`).join('')}
          </div>` : ''}
        </div>`).join('')}
      </div>
      <div class="cat-row cat-add"><span class="grip" style="visibility:hidden"></span><span class="sub-plus">${icon('i-plus')}</span><input id="cat-add" data-act="cat-add" data-fk="cat-add" placeholder="New category" enterkeyhint="done"></div>
      <hr>
      <button class="text-btn" data-act="export">${icon('i-down')}Download a backup</button>
      <button class="text-btn" data-act="import">${icon('i-up')}Restore from a backup</button>
      <button class="text-btn" data-act="clear-all-done">${icon('i-history')}Move all completed to History</button>
      <div class="hint">Quick add shortcuts: <code>@3pm</code> time · <code>45m</code> / <code>1h</code> duration · <code>!</code> high · <code>!!</code> urgent · <code>#work</code> category · <code>__</code> fades the rest of a title. Press <code>N</code> to jump to quick add.<br><br>${mode === 'db' ? 'Saved to your Claude account — private to you, and there on any device where you open this page.' : 'Saved in this browser on this device.'}</div>`;
    pop.classList.add('show');
    if(fk){ const f = pop.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if(f) f.focus({ preventScroll:true }); }
  }
  async function exportData(){
    let history = [];
    try{ history = await readArchive(); }catch(e){}
    const json = JSON.stringify({ v:1, exported:new Date().toISOString(), tasks:st.tasks, settings:st.settings, history }, null, 2);
    const filename = `timebox-backup-${todayISO()}.json`;
    if(window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if(!dl){ toast('Downloads aren’t available here'); return; }
      try{ await dl.save({ filename, data:json }); }
      catch(e){ if(e && e.code !== 'declined') toast('The backup couldn’t be saved'); }
      return;
    }
    const blob = new Blob([json], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('#import-file').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!d || !Array.isArray(d.tasks)) throw new Error('bad');
      $('#pop').classList.remove('show');
      toast(`Replace your tasks with the ${d.tasks.length} in this backup?`, 'Replace', () => {
        st = { tasks:d.tasks.map(normTask), settings:normSettings(d.settings) };
        rollover(); autoPush(); save(); saveSettings(); ui.open.clear(); render();
        if(Array.isArray(d.history) && d.history.length) writeArchive(d.history.filter(x => x && x.id && x.title && x.doneAt)).catch(syncError);
        setTimeout(() => toast('Backup restored'), 50);
      });
    }catch(err){ toast('That file isn’t a Timebox backup'); }
  });

  /* ================= Clock ================= */
  let lastDay = todayISO();
  function tick(){
    if(drag.active || !ready) return;
    const dayChanged = todayISO() !== lastDay; lastDay = todayISO();
    const rolled = rollover();
    const moved = autoPush();
    if(rolled || moved.length) save();
    if(rolled || moved.length || dayChanged || floor30(nowMin()) !== lastCur) render();
    else updateNowLine();
    archiveOld();
    if(moved.length) toast(moved.length === 1 ? `“${moved[0].title}” moved to ${fmtClock(moved[0].slot)}` : `${moved.length} unfinished tasks moved to ${fmtClock(moved[0].slot)}`);
  }
  setInterval(tick, 20000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) tick(); });

  document.body.dataset.tab = ui.tab;
  boot();
})();
</script>
</body>
</html>
